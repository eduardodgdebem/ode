name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Building for Linux links with lld and archives musl with llvm-ar.
      - name: Install LLVM's linker and archiver
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y lld llvm
          else
            brew install lld llvm
          fi

      # musl, built once per target from vendor/.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ode
          key: ode-libc-${{ runner.os }}-${{ hashFiles('vendor/*.tar.gz') }}

      # From nothing but the checked-in seed and clang, as a fresh checkout
      # would.
      - name: Build from the seed
        run: ./build.sh

      # Apple's clang has no WebAssembly backend, so the suite, which builds
      # wasm modules, runs with Homebrew's on macOS.
      - name: Test
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export ODE_CC="$(brew --prefix llvm)/bin/clang"
          fi
          ./build/ode build test

      # The compiler must reproduce itself byte for byte.
      - name: Bootstrap
        run: ./build/ode build bootstrap
